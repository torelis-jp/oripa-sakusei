<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 オリパ作成記録ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .content {
            padding: 30px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        thead {
            background: #f5f5f5;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fafafa;
        }

        .text-right {
            text-align: right;
        }

        .text-success {
            color: #27ae60;
            font-weight: 600;
        }

        .text-danger {
            color: #e74c3c;
        }

        .last-one-prize-row {
            background: #fff3e0;
            font-weight: 600;
        }

        .calc-box {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .calc-item strong {
            color: #333;
        }

        .calc-value {
            color: #667eea;
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .oripa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .oripa-card {
            background: white;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .oripa-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .oripa-card h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #333;
        }

        .oripa-card p {
            color: #666;
            margin: 8px 0;
            font-size: 0.95em;
        }

        .oripa-card .price {
            color: #e74c3c;
            font-weight: 700;
            font-size: 1.2em;
        }

        .oripa-card-footer {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: space-between;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 10px;
            }

            .oripa-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 オリパ作成記録ツール</h1>
            <div class="status-bar">
                <div class="status-item">📊 オリパ: <span id="oripaCount">0</span>件</div>
                <div class="status-item">💳 カード: <span id="cardCount">0</span>枚</div>
                <div id="syncStatus" class="status-item">💾 ローカル保存</div>
            </div>
        </div>

        <div class="content">
            <div class="button-group">
                <button class="btn-primary" onclick="showTab('home')">🏠 ホーム</button>
                <button class="btn-primary" onclick="showTab('create')">➕ 新規作成</button>
                <button class="btn-primary" onclick="showTab('spreadsheet')">📊 スプレッドシート</button>
                <button class="btn-secondary" onclick="exportToCSV()">📥 CSVダウンロード</button>
                <button class="btn-secondary" onclick="openSheetsModal()">⚙️ Sheets設定</button>
            </div>

            <!-- ホームタブ -->
            <div id="home" class="tab-content active">
                <h2>📋 登録済みオリパ</h2>
                <div id="oripaList" class="oripa-grid"></div>
            </div>

            <!-- 新規作成タブ -->
            <div id="create" class="tab-content">
                <h2>➕ 新しいオリパを作成</h2>
                
                <div class="form-group">
                    <label>オリパ名</label>
                    <input type="text" id="oripaName" placeholder="例: SSR確定パック">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>1口の値段（円）</label>
                        <input type="number" id="unitPrice" placeholder="例: 500" min="0">
                    </div>
                    <div class="form-group">
                        <label>全口数</label>
                        <input type="number" id="totalCount" placeholder="例: 100" min="0">
                    </div>
                </div>

                <button class="btn-primary" onclick="createOripa()">✅ オリパを作成</button>

                <h3 style="margin-top: 40px;">🃏 カード情報を追加</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>型番</label>
                        <input type="text" id="cardNumber" placeholder="例: S4a-123">
                    </div>
                    <div class="form-group">
                        <label>カード名</label>
                        <input type="text" id="cardName" placeholder="例: ピカチュウ PSA10">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>封入金額（円）</label>
                        <input type="number" id="cardValue" placeholder="例: 5000" min="0">
                    </div>
                    <div class="form-group">
                        <label>枚数</label>
                        <input type="number" id="cardCount" placeholder="例: 1" min="0">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="isLastOnePrize">
                    <label for="isLastOnePrize" style="margin-bottom: 0;">ラストワン賞として追加</label>
                </div>

                <button class="btn-primary" onclick="addCard()">➕ カードを追加</button>

                <h3 style="margin-top: 40px;">カード一覧</h3>
                <div id="cardTableContainer"></div>

                <div id="calcDisplay"></div>

                <div class="button-group" style="margin-top: 30px;">
                    <button class="btn-primary" onclick="saveData()">💾 保存</button>
                    <button class="btn-secondary" onclick="showTab('home')">🏠 ホームに戻る</button>
                </div>
            </div>

            <!-- スプレッドシートタブ -->
            <div id="spreadsheet" class="tab-content">
                <h2>📊 スプレッドシート形式</h2>
                <p>以下のテーブルを Google Sheets にコピー・ペーストできます</p>
                
                <button class="btn-secondary" onclick="copyTableToClipboard()">📋 テーブルをコピー</button>
                
                <div id="spreadsheetTable" style="overflow-x: auto; margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <!-- Sheets設定モーダル -->
    <div id="sheetsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">⚙️ Sheets設定</div>
            <div class="modal-body">
                <p>Google Apps Scriptを使用している場合は、以下の設定は不要です</p>
                <div class="form-group">
                    <label>Sheet ID</label>
                    <input type="text" id="sheetId" placeholder="例: 1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p">
                </div>
                <div class="form-group">
                    <label>API キー</label>
                    <input type="password" id="apiKey" placeholder="Google Cloud Console から取得">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeSheetsModal()">キャンセル</button>
                <button class="btn-primary" onclick="saveSheetsConfig()">設定を保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentOripaId = null;
        let oripaList = [];
        let cardHistory = [];

        function init() {
            loadData();
            updateStatus();
            renderOripaList();
        }

        function loadData() {
            const savedOripas = localStorage.getItem('oripaList');
            const savedCards = localStorage.getItem('cardHistory');
            
            if (savedOripas) {
                oripaList = JSON.parse(savedOripas);
            }
            if (savedCards) {
                cardHistory = JSON.parse(savedCards);
            }
        }

        function saveData() {
            localStorage.setItem('oripaList', JSON.stringify(oripaList));
            localStorage.setItem('cardHistory', JSON.stringify(cardHistory));

            syncToSheets();

            alert('✅ データを保存しました');
        }

        // Google Apps Script への同期
        async function syncToSheets() {
            if (typeof google !== 'undefined') {
                try {
                    google.script.run
                        .withSuccessHandler(onSheetsSuccess)
                        .withFailureHandler(onSheetsError)
                        .saveOripasToSheet(JSON.stringify(oripaList));
                } catch (error) {
                    console.log('Sheets同期エラー:', error);
                }
            } else {
                console.log('ローカルに保存しています');
            }
        }

        function onSheetsSuccess(result) {
            if (result.success) {
                console.log('✅ Sheets同期成功:', result.message);
                updateSyncStatus();
            } else {
                console.error('❌ Sheets同期エラー:', result.error);
            }
        }

        function onSheetsError(error) {
            console.error('GAS呼び出しエラー:', error);
        }

        function updateStatus() {
            document.getElementById('oripaCount').textContent = oripaList.length;
            document.getElementById('cardCount').textContent = oripaList.reduce((sum, o) => sum + o.cards.length, 0);
            updateSyncStatus();
        }

        function updateSyncStatus() {
            const statusElement = document.getElementById('syncStatus');
            if (typeof google !== 'undefined') {
                statusElement.textContent = '☁️ Sheets連携中';
            } else {
                statusElement.textContent = '💾 ローカル保存';
            }
        }

        function showTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'spreadsheet') {
                showSpreadsheet();
            }
        }

        function createOripa() {
            const name = document.getElementById('oripaName').value;
            const unitPrice = parseInt(document.getElementById('unitPrice').value);
            const totalCount = parseInt(document.getElementById('totalCount').value);

            if (!name || !unitPrice || !totalCount) {
                alert('❌ すべての項目を入力してください');
                return;
            }

            currentOripaId = 'oripa_' + Date.now();
            oripaList.push({
                id: currentOripaId,
                name: name,
                createdDate: Date.now(),
                unitPrice: unitPrice,
                totalCount: totalCount,
                lastOnePrize: 0,
                cards: []
            });

            document.getElementById('oripaName').value = '';
            document.getElementById('unitPrice').value = '';
            document.getElementById('totalCount').value = '';

            updateStatus();
            renderCardTable();
            renderCalcDisplay();

            alert('✅ オリパを作成しました');
        }

        function addCard() {
            if (!currentOripaId) {
                alert('❌ 先にオリパを作成してください');
                return;
            }

            const isLastOne = document.getElementById('isLastOnePrize').checked;

            if (isLastOne) {
                const value = parseInt(document.getElementById('cardValue').value);
                if (!value) {
                    alert('❌ ラストワン賞の金額を入力してください');
                    return;
                }

                const oripa = oripaList.find(o => o.id === currentOripaId);
                oripa.lastOnePrize = value;

                document.getElementById('cardValue').value = '';
                document.getElementById('isLastOnePrize').checked = false;
            } else {
                const number = document.getElementById('cardNumber').value;
                const name = document.getElementById('cardName').value;
                const value = parseInt(document.getElementById('cardValue').value);
                const count = parseInt(document.getElementById('cardCount').value);

                if (!number || !name || !value || !count) {
                    alert('❌ すべての項目を入力してください');
                    return;
                }

                const oripa = oripaList.find(o => o.id === currentOripaId);
                const subtotal = value * count;
                const profit = subtotal;

                oripa.cards.push({
                    number: number,
                    name: name,
                    value: value,
                    count: count,
                    subtotal: subtotal,
                    profit: profit
                });

                document.getElementById('cardNumber').value = '';
                document.getElementById('cardName').value = '';
                document.getElementById('cardValue').value = '';
                document.getElementById('cardCount').value = '';
            }

            updateStatus();
            renderCardTable();
            renderCalcDisplay();
        }

        function deleteCard(index) {
            const oripa = oripaList.find(o => o.id === currentOripaId);
            oripa.cards.splice(index, 1);
            updateStatus();
            renderCardTable();
            renderCalcDisplay();
        }

        function deleteLastOnePrize() {
            const oripa = oripaList.find(o => o.id === currentOripaId);
            oripa.lastOnePrize = 0;
            updateStatus();
            renderCardTable();
            renderCalcDisplay();
        }

        function renderCardTable() {
            if (!currentOripaId) {
                document.getElementById('cardTableContainer').innerHTML = '';
                return;
            }

            const oripa = oripaList.find(o => o.id === currentOripaId);
            let html = '<table><thead><tr><th>型番</th><th>カード名</th><th>封入金額</th><th>枚数</th><th>小計</th><th>利益</th><th>操作</th></tr></thead><tbody>';

            oripa.cards.forEach((card, index) => {
                html += `
                    <tr>
                        <td>${card.number}</td>
                        <td>${card.name}</td>
                        <td class="text-right">¥${Math.round(card.value).toLocaleString()}</td>
                        <td class="text-right">${card.count}</td>
                        <td class="text-right">¥${Math.round(card.subtotal).toLocaleString()}</td>
                        <td class="text-right text-success">¥${Math.round(card.profit).toLocaleString()}</td>
                        <td><button class="btn-delete" onclick="deleteCard(${index})">削除</button></td>
                    </tr>
                `;
            });

            if (oripa.lastOnePrize && oripa.lastOnePrize > 0) {
                html += `
                    <tr class="last-one-prize-row">
                        <td>-</td>
                        <td>⭐ ラストワン賞</td>
                        <td class="text-right">¥${Math.round(oripa.lastOnePrize).toLocaleString()}</td>
                        <td class="text-right">1</td>
                        <td class="text-right">¥${Math.round(oripa.lastOnePrize).toLocaleString()}</td>
                        <td class="text-right text-success">¥${Math.round(oripa.lastOnePrize).toLocaleString()}</td>
                        <td><button class="btn-delete" onclick="deleteLastOnePrize()">削除</button></td>
                    </tr>
                `;
            }

            html += '</tbody></table>';
            document.getElementById('cardTableContainer').innerHTML = html;
        }

        function renderCalcDisplay() {
            if (!currentOripaId) {
                document.getElementById('calcDisplay').innerHTML = '';
                return;
            }

            const oripa = oripaList.find(o => o.id === currentOripaId);
            const cardsTotal = oripa.cards.reduce((sum, c) => sum + (c.value * c.count), 0);
            const totalValue = cardsTotal + (oripa.lastOnePrize || 0);
            const saleAmount = oripa.totalCount * oripa.unitPrice;
            const profit = (saleAmount + (oripa.lastOnePrize || 0)) - totalValue;
            const returnRate = saleAmount > 0 ? Math.round((totalValue / saleAmount) * 100) : 0;

            const html = `
                <div class="calc-box">
                    <div class="calc-item">
                        <strong>販売予定金額:</strong>
                        <span class="calc-value">¥${Math.round(saleAmount).toLocaleString()}</span>
                    </div>
                    <div class="calc-item">
                        <strong>合計封入金額:</strong>
                        <span class="calc-value">¥${Math.round(totalValue).toLocaleString()}</span>
                    </div>
                    <div class="calc-item">
                        <strong>見込み利益:</strong>
                        <span class="calc-value" style="color: ${profit >= 0 ? '#27ae60' : '#e74c3c'}">
                            ¥${Math.round(profit).toLocaleString()}
                        </span>
                    </div>
                    <div class="calc-item">
                        <strong>実現還元率:</strong>
                        <span class="calc-value">${returnRate}%</span>
                    </div>
                </div>
            `;

            document.getElementById('calcDisplay').innerHTML = html;
        }

        function renderOripaList() {
            let html = '';

            if (oripaList.length === 0) {
                html = '<p>オリパが登録されていません</p>';
            } else {
                oripaList.forEach(oripa => {
                    const cardsTotal = oripa.cards.reduce((sum, c) => sum + (c.value * c.count), 0);
                    const totalValue = cardsTotal + (oripa.lastOnePrize || 0);
                    const saleAmount = oripa.totalCount * oripa.unitPrice;
                    const profit = (saleAmount + (oripa.lastOnePrize || 0)) - totalValue;

                    html += `
                        <div class="oripa-card">
                            <h3>${oripa.name}</h3>
                            <p>作成日: ${new Date(oripa.createdDate).toLocaleDateString('ja-JP')}</p>
                            <p>1口: ¥${oripa.unitPrice.toLocaleString()} × ${oripa.totalCount}口</p>
                            <p>カード枚数: ${oripa.cards.length}枚</p>
                            <p>見込み利益: <span class="price" style="color: ${profit >= 0 ? '#27ae60' : '#e74c3c'}">¥${Math.round(profit).toLocaleString()}</span></p>
                            <div class="oripa-card-footer">
                                <button class="btn-primary btn-small" onclick="editOripa('${oripa.id}')">編集</button>
                                <button class="btn-danger btn-small" onclick="deleteOripaFromList('${oripa.id}')">削除</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('oripaList').innerHTML = html;
        }

        function editOripa(id) {
            currentOripaId = id;
            showTab('create');
            renderCardTable();
            renderCalcDisplay();
        }

        function deleteOripaFromList(id) {
            if (confirm('本当に削除しますか？')) {
                oripaList = oripaList.filter(o => o.id !== id);
                updateStatus();
                renderOripaList();
                saveData();
            }
        }

        function generateSpreadsheet() {
            let html = '<table><thead><tr><th>ID</th><th>オリパ名</th><th>作成日</th><th>1口の値段</th><th>全口数</th><th>販売予定金額</th><th>ラストワン賞</th><th>カード種</th><th>合計金額</th><th>利益</th><th>還元率</th></tr></thead><tbody>';

            oripaList.forEach(oripa => {
                const cardsTotal = oripa.cards.reduce((sum, c) => sum + (c.value * c.count), 0);
                const totalValue = cardsTotal + (oripa.lastOnePrize || 0);
                const saleAmount = oripa.totalCount * oripa.unitPrice;
                const profit = (saleAmount + (oripa.lastOnePrize || 0)) - totalValue;
                const returnRate = saleAmount > 0 ? Math.round((totalValue / saleAmount) * 100) : 0;

                html += `
                    <tr>
                        <td>${oripa.id}</td>
                        <td>${oripa.name}</td>
                        <td>${new Date(oripa.createdDate).toLocaleDateString('ja-JP')}</td>
                        <td>${oripa.unitPrice}</td>
                        <td>${oripa.totalCount}</td>
                        <td>${saleAmount}</td>
                        <td>${oripa.lastOnePrize || 0}</td>
                        <td>${oripa.cards.length}</td>
                        <td>${Math.round(totalValue)}</td>
                        <td>${Math.round(profit)}</td>
                        <td>${returnRate}%</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            return html;
        }

        function showSpreadsheet() {
            document.getElementById('spreadsheetTable').innerHTML = generateSpreadsheet();
        }

        function copyTableToClipboard() {
            const table = document.querySelector('#spreadsheetTable table');
            if (!table) {
                alert('❌ テーブルがありません');
                return;
            }

            const range = document.createRange();
            range.selectNodeContents(table);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert('✅ テーブルをコピーしました');
        }

        function exportToCSV() {
            let csv = 'ID,オリパ名,作成日,1口の値段,全口数,販売予定金額,ラストワン賞,カード種,合計金額,利益,還元率\n';

            oripaList.forEach(oripa => {
                const cardsTotal = oripa.cards.reduce((sum, c) => sum + (c.value * c.count), 0);
                const totalValue = cardsTotal + (oripa.lastOnePrize || 0);
                const saleAmount = oripa.totalCount * oripa.unitPrice;
                const profit = (saleAmount + (oripa.lastOnePrize || 0)) - totalValue;
                const returnRate = saleAmount > 0 ? Math.round((totalValue / saleAmount) * 100) : 0;

                csv += `${oripa.id},"${oripa.name}",${new Date(oripa.createdDate).toLocaleDateString('ja-JP')},${oripa.unitPrice},${oripa.totalCount},${saleAmount},${oripa.lastOnePrize || 0},${oripa.cards.length},${Math.round(totalValue)},${Math.round(profit)},${returnRate}%\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'oripa-' + new Date().toISOString().slice(0, 10) + '.csv';
            link.click();
        }

        function openSheetsModal() {
            document.getElementById('sheetsModal').classList.add('active');
        }

        function closeSheetsModal() {
            document.getElementById('sheetsModal').classList.remove('active');
        }

        function saveSheetsConfig() {
            const sheetId = document.getElementById('sheetId').value;
            const apiKey = document.getElementById('apiKey').value;

            if (sheetId) {
                localStorage.setItem('sheetId', sheetId);
            }
            if (apiKey) {
                localStorage.setItem('apiKey', apiKey);
            }

            alert('✅ Sheets設定を保存しました');
            closeSheetsModal();
            updateSyncStatus();
        }

        window.addEventListener('load', function() {
            init();
        });
    </script>
</body>
</html>
