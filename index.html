<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オリパ作成記録ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 30px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            background: #fafafa;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            background: #efefef;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Form Styles */
        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.three {
            grid-template-columns: 1fr 1fr 1fr;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        .btn-danger {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3);
        }

        /* Grid Layout */
        .oripa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .oripa-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .oripa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .oripa-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .oripa-card p {
            color: #666;
            font-size: 13px;
            margin: 5px 0;
        }

        /* Table Styles */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 12px;
            margin: 2px;
        }

        /* Calculation Display */
        .calc-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .calc-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .calc-item strong {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .calc-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .calc-item.profit {
            border-left-color: #28a745;
        }

        .calc-item.profit.negative {
            border-left-color: #dc3545;
        }

        .calc-item.profit.negative .value {
            color: #dc3545;
        }

        .calc-item.profit .value {
            color: #28a745;
        }

        /* Last One Prize Styling */
        .last-one-row {
            background-color: #fff3e0 !important;
            font-weight: 600;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .modal-close:hover {
            color: #000;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-row.three {
                grid-template-columns: 1fr;
            }

            .calc-box {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 0 1 50%;
            }
        }

        .text-center {
            text-align: center;
        }

        .text-muted {
            color: #999;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 オリパ作成記録ツール</h1>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span>オリパ数:</span>
                <strong id="oripasCount">0</strong>
            </div>
            <div class="status-item">
                <span>カード数:</span>
                <strong id="cardsCount">0</strong>
            </div>
            <div class="status-item">
                <span id="syncStatus">💾 ローカル保存</span>
            </div>
            <button onclick="openSettings()" style="font-size: 12px; padding: 6px 12px;">⚙️ 設定</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('home')">🏠 ホーム</button>
            <button class="tab-btn" onclick="switchTab('detail')">📝 詳細</button>
            <button class="tab-btn" onclick="switchTab('summary')">📊 サマリー</button>
        </div>

        <!-- ホーム Tab -->
        <div id="home" class="tab-content active">
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">新規オリパ作成</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>オリパ名</label>
                        <input type="text" id="newOripaName" placeholder="例: 秋葉原オリパ">
                    </div>
                    <div class="form-group">
                        <label>1口の値段（¥）</label>
                        <input type="number" id="newOripaPrice" placeholder="1000" min="0">
                    </div>
                    <div class="form-group">
                        <label>全口数</label>
                        <input type="number" id="newOripaCount" placeholder="10" min="0">
                    </div>
                </div>
                <button onclick="createOripaFromHome()" style="width: 100%; margin-top: 10px;">オリパを作成</button>
            </div>

            <h2 style="margin-top: 30px; margin-bottom: 20px; color: #333;">登録済みオリパ</h2>
            <div id="oripaListHome" class="oripa-grid"></div>
        </div>

        <!-- 詳細 Tab -->
        <div id="detail" class="tab-content">
            <div id="detailContent" style="text-align: center; color: #999; padding: 40px;">
                ホームからオリパを選択してください
            </div>
        </div>

        <!-- サマリー Tab -->
        <div id="summary" class="tab-content">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>オリパ名</th>
                            <th>作成日</th>
                            <th>1口の値段</th>
                            <th>全口数</th>
                            <th>販売予定金額</th>
                            <th>カード数</th>
                            <th>合計封入金額</th>
                            <th>見込み利益</th>
                            <th>実現還元率</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTable">
                    </tbody>
                </table>
            </div>
            <button onclick="downloadSummaryCSV()" style="margin-top: 20px;">📥 CSVでダウンロード</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeSettings()">&times;</span>
            <div class="modal-header">設定</div>

            <div class="form-section">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 16px;">📊 Google Sheets連携（オプション）</h3>
                <p style="color: #666; font-size: 13px; margin-bottom: 15px;">
                    Google Sheetsに自動保存したい場合は、以下の設定を行ってください。
                </p>

                <div class="form-group">
                    <label>Google Sheets API キー</label>
                    <input type="text" id="apiKey" placeholder="AIza..." style="font-size: 12px;">
                    <p style="color: #999; font-size: 12px; margin-top: 5px;">
                        <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color: #667eea;">Google Cloud Consoleで作成</a>
                    </p>
                </div>

                <div class="form-group">
                    <label>Google Sheet ID</label>
                    <input type="text" id="sheetId" placeholder="1j13t6JjCM4WTSe9S0zmfbcBB6wgqPMPsGva8-VYfXWE">
                    <p style="color: #999; font-size: 12px; margin-top: 5px;">
                        Sheet URLの<code>/d/</code>と<code>/edit</code>の間の文字列
                    </p>
                </div>

                <button onclick="testSheetsConnection()" style="width: 100%; margin-bottom: 10px;">接続テスト</button>
                <button onclick="saveSettings()" style="width: 100%;">設定を保存</button>
            </div>

            <div class="form-section" style="margin-top: 20px;">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 16px;">💾 データ管理</h3>
                <button onclick="exportAllData()" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">すべてのデータをエクスポート</button>
                <button onclick="importDataFromFile()" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">データをインポート</button>
                <button onclick="clearAllData()" class="btn-danger" style="width: 100%;">⚠️ すべてのデータを削除</button>
            </div>
        </div>
    </div>

    <script>
        // Global State
        let oripaList = [];
        let currentOripaId = null;
        let sheetsConfig = {
            apiKey: '',
            sheetId: ''
        };

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            loadSheetsConfig();
            renderUI();
        });

        // Data Management
        function loadData() {
            const stored = localStorage.getItem('oripaList');
            oripaList = stored ? JSON.parse(stored) : [];
        }

        function saveData() {
            localStorage.setItem('oripaList', JSON.stringify(oripaList));
            if (sheetsConfig.apiKey && sheetsConfig.sheetId) {
                syncToSheets();
            }
        }

        function loadSheetsConfig() {
            const stored = localStorage.getItem('sheetsConfig');
            if (stored) {
                sheetsConfig = JSON.parse(stored);
            }
        }

        // Sheets Config Management
        function openSettings() {
            document.getElementById('settingsModal').classList.add('show');
            document.getElementById('apiKey').value = sheetsConfig.apiKey;
            document.getElementById('sheetId').value = sheetsConfig.sheetId;
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function saveSettings() {
            sheetsConfig.apiKey = document.getElementById('apiKey').value;
            sheetsConfig.sheetId = document.getElementById('sheetId').value;
            localStorage.setItem('sheetsConfig', JSON.stringify(sheetsConfig));
            alert('設定を保存しました');
            closeSettings();
        }

        async function testSheetsConnection() {
            if (!sheetsConfig.apiKey || !sheetsConfig.sheetId) {
                alert('APIキーとSheet IDを入力してください');
                return;
            }

            const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetsConfig.sheetId}?key=${sheetsConfig.apiKey}`;

            try {
                const response = await fetch(url);
                if (response.ok) {
                    alert('✅ Google Sheetsに接続できました');
                } else {
                    alert('❌ 接続失敗: APIキーまたはSheet IDを確認してください');
                }
            } catch (error) {
                alert('❌ ネットワークエラー: ' + error.message);
            }
        }

        // Oripa Operations
        function createOripaFromHome() {
            const name = document.getElementById('newOripaName').value.trim();
            const unitPrice = parseInt(document.getElementById('newOripaPrice').value) || 0;
            const totalCount = parseInt(document.getElementById('newOripaCount').value) || 0;

            if (!name) {
                alert('オリパ名を入力してください');
                return;
            }

            const newOripa = {
                id: Date.now().toString(),
                name: name,
                createdDate: new Date().toISOString().split('T')[0],
                unitPrice: unitPrice,
                totalCount: totalCount,
                lastOnePrize: 0,
                cards: []
            };

            oripaList.push(newOripa);
            saveData();

            document.getElementById('newOripaName').value = '';
            document.getElementById('newOripaPrice').value = '';
            document.getElementById('newOripaCount').value = '';

            renderUI();
            alert('オリパを作成しました');
        }

        function selectOripaForEdit(oripaId) {
            currentOripaId = oripaId;
            switchTab('detail');
            renderDetailTab();
        }

        function deleteOripa(oripaId) {
            if (confirm('このオリパを削除してもよろしいですか？')) {
                oripaList = oripaList.filter(o => o.id !== oripaId);
                saveData();
                renderUI();
            }
        }

        function addCard() {
            if (!currentOripaId) {
                alert('オリパを選択してください');
                return;
            }

            const oripa = oripaList.find(o => o.id === currentOripaId);
            if (!oripa) return;

            const modelNum = document.getElementById('cardModel').value.trim();
            const cardName = document.getElementById('cardName').value.trim();
            const price = parseInt(document.getElementById('cardPrice').value) || 0;
            const quantity = parseInt(document.getElementById('cardQuantity').value) || 1;
            const isLastOne = document.getElementById('isLastOne').checked;

            if (!modelNum || !cardName) {
                alert('型番とカード名を入力してください');
                return;
            }

            if (isLastOne) {
                oripa.lastOnePrize = price;
                document.getElementById('cardModel').value = '';
                document.getElementById('cardName').value = '';
                document.getElementById('cardPrice').value = '';
                document.getElementById('cardQuantity').value = '1';
                document.getElementById('isLastOne').checked = false;
            } else {
                oripa.cards.push({
                    id: Date.now().toString(),
                    modelNum: modelNum,
                    cardName: cardName,
                    price: price,
                    quantity: quantity
                });

                document.getElementById('cardModel').value = '';
                document.getElementById('cardName').value = '';
                document.getElementById('cardPrice').value = '';
                document.getElementById('cardQuantity').value = '1';
            }

            saveData();
            renderDetailTab();
        }

        function deleteCard(cardId) {
            if (!currentOripaId) return;

            const oripa = oripaList.find(o => o.id === currentOripaId);
            if (!oripa) return;

            oripa.cards = oripa.cards.filter(c => c.id !== cardId);
            saveData();
            renderDetailTab();
        }

        function deleteLastOnePrize() {
            if (!currentOripaId) return;

            const oripa = oripaList.find(o => o.id === currentOripaId);
            if (!oripa) return;

            if (confirm('ラストワン賞を削除してもよろしいですか？')) {
                oripa.lastOnePrize = 0;
                saveData();
                renderDetailTab();
            }
        }

        // Calculations
        function calculateTotalCardValue(oripa) {
            return oripa.cards.reduce((sum, card) => sum + (card.price * card.quantity), 0);
        }

        function calculateMetrics(oripa) {
            const saleAmount = oripa.totalCount * oripa.unitPrice;
            const totalCardValue = calculateTotalCardValue(oripa);
            const totalValue = totalCardValue + oripa.lastOnePrize;
            const profit = saleAmount + oripa.lastOnePrize - totalValue;
            const returnRate = saleAmount > 0 ? (totalValue / saleAmount * 100) : 0;

            return {
                saleAmount,
                totalCardValue,
                totalValue,
                profit,
                returnRate
            };
        }

        // UI Rendering
        function renderUI() {
            renderOripaListHome();
            renderSummaryTab();
            updateStatusBar();
        }

        function updateStatusBar() {
            const totalCards = oripaList.reduce((sum, o) => sum + o.cards.length, 0);
            document.getElementById('oripasCount').textContent = oripaList.length;
            document.getElementById('cardsCount').textContent = totalCards;
        }

        function renderOripaListHome() {
            const container = document.getElementById('oripaListHome');
            container.innerHTML = oripaList.map(oripa => {
                const metrics = calculateMetrics(oripa);
                return `
                    <div class="oripa-card" onclick="selectOripaForEdit('${oripa.id}')">
                        <h3>${oripa.name}</h3>
                        <p><strong>作成日:</strong> ${oripa.createdDate}</p>
                        <p><strong>1口:</strong> ¥${oripa.unitPrice.toLocaleString()}</p>
                        <p><strong>全口数:</strong> ${oripa.totalCount}</p>
                        <p><strong>販売予定:</strong> ¥${metrics.saleAmount.toLocaleString()}</p>
                        <p><strong>カード数:</strong> ${oripa.cards.length}</p>
                        <p style="margin-top: 10px; ${metrics.profit >= 0 ? 'color: #28a745' : 'color: #dc3545'}">
                            <strong>見込み利益: ¥${metrics.profit.toLocaleString()}</strong>
                        </p>
                        <button onclick="event.stopPropagation(); deleteOripa('${oripa.id}')" class="btn-danger" style="width: 100%; margin-top: 10px;">削除</button>
                    </div>
                `;
            }).join('');
        }

        function renderDetailTab() {
            if (!currentOripaId) {
                document.getElementById('detailContent').innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">ホームからオリパを選択してください</div>';
                return;
            }

            const oripa = oripaList.find(o => o.id === currentOripaId);
            if (!oripa) return;

            const metrics = calculateMetrics(oripa);

            const html = `
                <h2 style="margin-bottom: 20px; color: #333;">${oripa.name}</h2>

                <div class="form-section">
                    <h3 style="margin-bottom: 15px; color: #333; font-size: 16px;">カード情報を追加</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>型番</label>
                            <input type="text" id="cardModel" placeholder="例: PSA-001">
                        </div>
                        <div class="form-group">
                            <label>カード名</label>
                            <input type="text" id="cardName" placeholder="例: 秋葉原キャラ">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>封入金額（¥）</label>
                            <input type="number" id="cardPrice" placeholder="10000" min="0">
                        </div>
                        <div class="form-group">
                            <label>枚数</label>
                            <input type="number" id="cardQuantity" placeholder="1" min="1" value="1">
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="isLastOne">
                        <label for="isLastOne" style="margin: 0;">⭐ ラストワン賞として設定</label>
                    </div>
                    <button onclick="addCard()" style="width: 100%; margin-top: 15px;">カードを追加</button>
                </div>

                ${oripa.cards.length > 0 || oripa.lastOnePrize > 0 ? `
                    <h3 style="margin-top: 30px; margin-bottom: 20px; color: #333;">カード一覧</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>型番</th>
                                    <th>カード名</th>
                                    <th>封入金額</th>
                                    <th>枚数</th>
                                    <th>小計</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${oripa.cards.map(card => `
                                    <tr>
                                        <td>${card.modelNum}</td>
                                        <td>${card.cardName}</td>
                                        <td>¥${card.price.toLocaleString()}</td>
                                        <td>${card.quantity}</td>
                                        <td>¥${(card.price * card.quantity).toLocaleString()}</td>
                                        <td><button onclick="deleteCard('${card.id}')" class="btn-danger">削除</button></td>
                                    </tr>
                                `).join('')}
                                ${oripa.lastOnePrize > 0 ? `
                                    <tr class="last-one-row">
                                        <td colspan="2">⭐ ラストワン賞</td>
                                        <td>¥${oripa.lastOnePrize.toLocaleString()}</td>
                                        <td>1</td>
                                        <td>¥${oripa.lastOnePrize.toLocaleString()}</td>
                                        <td><button onclick="deleteLastOnePrize()" class="btn-danger">削除</button></td>
                                    </tr>
                                ` : ''}
                            </tbody>
                        </table>
                    </div>
                ` : ''}

                <div class="calc-box">
                    <div class="calc-item">
                        <strong>販売予定金額</strong>
                        <div class="value">¥${metrics.saleAmount.toLocaleString()}</div>
                    </div>
                    <div class="calc-item">
                        <strong>合計封入金額</strong>
                        <div class="value">¥${metrics.totalValue.toLocaleString()}</div>
                    </div>
                    <div class="calc-item profit ${metrics.profit >= 0 ? '' : 'negative'}">
                        <strong>見込み利益</strong>
                        <div class="value">¥${metrics.profit.toLocaleString()}</div>
                    </div>
                    <div class="calc-item">
                        <strong>実現還元率</strong>
                        <div class="value">${metrics.returnRate.toFixed(1)}%</div>
                    </div>
                </div>
            `;

            document.getElementById('detailContent').innerHTML = html;
        }

        function renderSummaryTab() {
            const tbody = document.getElementById('summaryTable');
            tbody.innerHTML = oripaList.map(oripa => {
                const metrics = calculateMetrics(oripa);
                return `
                    <tr>
                        <td>${oripa.name}</td>
                        <td>${oripa.createdDate}</td>
                        <td>¥${oripa.unitPrice.toLocaleString()}</td>
                        <td>${oripa.totalCount}</td>
                        <td>¥${metrics.saleAmount.toLocaleString()}</td>
                        <td>${oripa.cards.length}${oripa.lastOnePrize > 0 ? ' + ⭐' : ''}</td>
                        <td>¥${metrics.totalValue.toLocaleString()}</td>
                        <td style="color: ${metrics.profit >= 0 ? '#28a745' : '#dc3545'}; font-weight: 600;">¥${metrics.profit.toLocaleString()}</td>
                        <td>${metrics.returnRate.toFixed(1)}%</td>
                    </tr>
                `;
            }).join('');
        }

        // Tab Navigation
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'detail') {
                renderDetailTab();
            } else if (tabName === 'summary') {
                renderSummaryTab();
            }
        }

        // Export/Import
        function downloadSummaryCSV() {
            let csv = '【オリパ一覧】\n';
            csv += 'オリパ名,作成日,1口の値段,全口数,販売予定金額,カード数,合計封入金額,見込み利益,実現還元率\n';

            oripaList.forEach(oripa => {
                const metrics = calculateMetrics(oripa);
                csv += `"${oripa.name}",${oripa.createdDate},${oripa.unitPrice},${oripa.totalCount},${metrics.saleAmount},${oripa.cards.length},${metrics.totalValue},${metrics.profit},${metrics.returnRate.toFixed(1)}%\n`;
            });

            csv += '\n【カード詳細】\n';
            oripaList.forEach(oripa => {
                csv += `\n"${oripa.name}"\n`;
                csv += '型番,カード名,封入金額,枚数,小計\n';
                oripa.cards.forEach(card => {
                    csv += `"${card.modelNum}","${card.cardName}",${card.price},${card.quantity},${card.price * card.quantity}\n`;
                });
                if (oripa.lastOnePrize > 0) {
                    csv += `"","⭐ ラストワン賞",${oripa.lastOnePrize},1,${oripa.lastOnePrize}\n`;
                }
            });

            const blob = new Blob([csv], { type: 'text/csv; charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `オリパ記録_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function exportAllData() {
            const dataStr = JSON.stringify({ oripaList, sheetsConfig }, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `オリパデータ_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        function importDataFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        oripaList = data.oripaList || [];
                        if (data.sheetsConfig) {
                            sheetsConfig = data.sheetsConfig;
                            localStorage.setItem('sheetsConfig', JSON.stringify(sheetsConfig));
                        }
                        saveData();
                        renderUI();
                        alert('✅ データをインポートしました');
                    } catch (error) {
                        alert('❌ ファイルが正しくありません: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function clearAllData() {
            if (confirm('⚠️ すべてのデータが削除されます。本当に削除しますか？')) {
                if (confirm('最後の確認: 本当に削除してもよろしいですか？')) {
                    oripaList = [];
                    localStorage.removeItem('oripaList');
                    renderUI();
                    alert('すべてのデータを削除しました');
                }
            }
        }

        // Sheets Sync
        async function syncToSheets() {
            if (!sheetsConfig.apiKey || !sheetsConfig.sheetId) return;

            try {
                document.getElementById('syncStatus').textContent = '☁️ Sheets連携中...';

                // Create or update sheets for each oripa
                for (const oripa of oripaList) {
                    await updateOripaSheet(oripa);
                }

                document.getElementById('syncStatus').textContent = '☁️ Sheets連携完了';
                setTimeout(() => {
                    document.getElementById('syncStatus').textContent = '💾 ローカル保存';
                }, 3000);
            } catch (error) {
                console.error('Sheets sync error:', error);
                document.getElementById('syncStatus').textContent = '❌ 同期失敗';
            }
        }
